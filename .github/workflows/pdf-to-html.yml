name: Generate Resume HTML

on:
  push:
    paths:
      - assets/resume.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Generate index.html from resume PDF
        run: python scripts/generate_resume_html.py --pdf assets/resume.pdf --output index.html --template index.html

      - name: Commit generated HTML
        run: |
          if git diff --quiet index.html; then
            echo "No HTML changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: regenerate resume HTML from PDF"
          git push
